name: Monday — Execute Trades

on:
  schedule:
    - cron: "30 13 * * 1"   # Monday 1:30pm UTC = 9:30am ET (summer) / 8:30am ET (winter)
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:
  execute:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute trades
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m bot.execute

      - name: Commit memory
        run: |
          git config user.name "Trading Agent"
          git config user.email "trading-agent@github-actions"
          git add memory.json
          git diff --staged --quiet || git commit -m "Monday $(date +%Y-%m-%d): trades executed"
          git push
