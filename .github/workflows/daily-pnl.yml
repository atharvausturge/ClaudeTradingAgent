name: Daily P&L

on:
  schedule:
    - cron: "5 21 * * 1-5"   # 4:05 PM ET (standard) / 5:05 PM ET (DST), Mon-Fri
  workflow_dispatch:

jobs:
  pnl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post daily P&L
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m bot.daily_pnl

      - name: Commit snapshot
        run: |
          git config user.name "Trading Agent"
          git config user.email "trading-agent@github-actions"
          git add memory.json
          git diff --staged --quiet || git commit -m "Daily P&L $(date +%Y-%m-%d)"
          git push
