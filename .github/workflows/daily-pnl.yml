name: Daily P&L

on:
  schedule:
    - cron: "12 21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trading-bot-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  pnl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post daily P&L
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m bot.daily_pnl

      - name: Commit results
        if: always()
        run: |
          git config user.name "Trading Agent"
          git config user.email "trading-agent@github-actions"
          git add memory.json
          if git diff --staged --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Daily P&L $(date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && exit 0; sleep 5; done
          exit 1

      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m bot.notify failure "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
