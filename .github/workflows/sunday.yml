name: Sunday — Research & Analysis

on:
  schedule:
    - cron: "0 23 * * 0"   # Sunday 11pm UTC = 7pm ET (summer) / 6pm ET (winter)
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run research
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m bot.research

      - name: Analyze with Groq + notify Discord
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m bot.analyze

      - name: Commit research + trade plan
        run: |
          git config user.name "Trading Agent"
          git config user.email "trading-agent@github-actions"
          git add data/trade_plan.json data/research_data.json
          [ -f data/universe_cache.json ] && git add data/universe_cache.json || true
          git diff --staged --quiet || git commit -m "Sunday $(date +%Y-%m-%d): research + proposed plan"
          git push
